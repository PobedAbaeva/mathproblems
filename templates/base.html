<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#667eea"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"/>
    <title>Math Problems</title>
    {% block head %}{% endblock %}
</head>
<body>
<div class="bg-animated"></div>
<div class="particles" id="particles"></div>

<header>
    <nav class="navbar navbar-light">
        <a class="navbar-brand" href="/">Math Problems</a>
        <div class="ml-auto">
            {% if current_user.is_authenticated %}
                <!-- Пользователь вошёл — показываем кнопку «Выход» -->
                <a class="btn btn-outline-primary" href="{{ url_for('logout') }}">Выход</a>
            {% else %}
                <!-- Пользователь не вошёл — кнопки «Войти» и «Регистрация» -->
                <a class="btn btn-outline-primary mr-2" href="{{ url_for('login') }}">Войти</a>
                <a class="btn btn-primary" href="{{ url_for('register') }}">Зарегистрироваться</a>
            {% endif %}
        </div>
    </nav>
</header>

<div class="content">{% block content %}{% endblock %}</div>
</body>
</html>
